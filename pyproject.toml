[project]
name = "mistral-ocr"
version = "0.1.0"
description = "Extract text from PDFs as Markdown via the Mistral OCR API."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
authors = [
    { name = "escapace", email = "opensource@escapace.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mistralai>=1.12.0",
    "pydantic>=2.12.5",
    "typer>=0.21.1",
]

[project.urls]
Repository = "https://github.com/escapace/mistral-ocr"

[project.scripts]
mistral-ocr = "mistral_ocr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mistral_ocr"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check src/"
format = "ruff format src/"
typecheck = "pyright"
check = ["lint", "typecheck"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
